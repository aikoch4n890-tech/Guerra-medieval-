<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Guerra dos Reinos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b100c;overflow:hidden;touch-action:manipulation;
    font-family:'Lilita One',system-ui,sans-serif;-webkit-user-select:none;user-select:none;color:#fff}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.6)}
  canvas{display:block;width:100%;height:100%}
  #testBtn{position:absolute;right:8px;bottom:8px;opacity:.85;z-index:3;border:2px solid #000;border-radius:10px;
    background:#ffd23f;color:#1a1a1a;font:inherit;font-size:15px;padding:6px 10px;cursor:pointer;box-shadow:0 3px 0 #000}
  #soundBtn{position:absolute;left:8px;bottom:8px;z-index:3;border:2px solid #000;border-radius:10px;
    background:#3a4250;color:#fff;font:inherit;font-size:15px;padding:6px 10px;cursor:pointer;box-shadow:0 3px 0 #000;opacity:.85}
  #soundBtn.on{background:#2e9d4f}
  #setup{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(5,8,12,.82)}
  #setup.open{display:flex}
  #setup .card{width:82%;background:#151b26;border:3px solid #000;border-radius:18px;padding:18px 16px;text-align:center;box-shadow:0 6px 0 #000}
  #setup .crown{font-size:44px}
  #setup h2{margin:4px 0 6px;font-weight:400;font-size:26px;color:#ffd23f}
  #setup p{margin:0 0 10px;font-size:16px}
  #setup input{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:2px solid #000;font-size:18px;font-family:system-ui,sans-serif;margin-bottom:10px}
  #setup button{display:block;width:100%;margin-top:8px;padding:11px;border:2px solid #000;border-radius:10px;font:inherit;font-size:17px;background:#2e9d4f;color:#fff;box-shadow:0 3px 0 #000;cursor:pointer}
  #setup button.ghost{background:#3a4250;font-size:15px}
  #setup small{display:block;margin-top:8px;color:#ff9b9b;font-family:system-ui,sans-serif;font-size:12px;min-height:14px}
  #panel{position:absolute;left:0;right:0;bottom:0;z-index:2;background:rgba(12,16,22,.94);
    border-top:3px solid #000;padding:10px 10px 14px;display:none}
  #panel.open{display:block}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .col h4{margin:0 0 6px;font-weight:400;font-size:16px;text-align:center;letter-spacing:.5px}
  .col.b h4{color:#6c9bff}.col.r h4{color:#ff6b6b}
  .col button{display:block;width:100%;margin:0 0 5px;padding:7px 4px;border:2px solid #000;border-radius:9px;
    font:inherit;font-size:13px;color:#fff;cursor:pointer;box-shadow:0 2px 0 #000;text-align:left}
  .col.b button{background:#2456d6}.col.r button{background:#c62828}
  .col button:active,.row button:active{transform:translateY(2px);box-shadow:none}
  .row{display:flex;gap:8px;margin-top:6px}
  .row button{flex:1;padding:8px 4px;border:2px solid #000;border-radius:9px;font:inherit;font-size:13px;
    background:#3a4250;color:#fff;cursor:pointer;box-shadow:0 2px 0 #000}
  .row button.on{background:#2e9d4f}
  #panel small{display:block;margin-top:8px;color:#aab;font-family:system-ui,sans-serif;font-size:11px;line-height:1.35}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c"></canvas>
  <button id="testBtn">🧪 Teste</button>
  <button id="soundBtn">🔇 Som</button>
  <div id="setup">
    <div class="card">
      <div class="crown">👑</div>
      <h2>Guerra dos Reinos</h2>
      <p>Qual é o seu @ do TikTok?</p>
      <input id="ttUser" placeholder="seuperfil" autocapitalize="off" autocomplete="off" spellcheck="false">
      <button id="setupGo">📡 Conectar à minha live</button>
      <button id="setupTest" class="ghost">Só testar</button>
      <small id="setupMsg"></small>
    </div>
  </div>
  <div id="panel">
    <div class="cols">
      <div class="col b"><h4>AZUL</h4>
        <button data-t="b" data-a="comment">💬 Comentário → entra no time</button>
        <button data-t="b" data-a="like">❤️ +100 curtidas → Soldado</button>
        <button data-t="b" data-a="g1">🌹 1 moeda → Lanceiro</button>
        <button data-t="b" data-a="g5">🫰 5 moedas → Cavaleiro</button>
        <button data-t="b" data-a="g30">🍩 30 moedas → Mago</button>
        <button data-t="b" data-a="g100">🎁 100 moedas → Catapulta</button>
        <button data-t="b" data-a="g500">🔫 500 moedas → Dragão</button>
        <button data-t="b" data-a="g1000">🌌 1000 moedas → 3 Dragões</button>
      </div>
      <div class="col r"><h4>VERMELHO</h4>
        <button data-t="r" data-a="comment">💬 Comentário → entra no time</button>
        <button data-t="r" data-a="like">❤️ +100 curtidas → Soldado</button>
        <button data-t="r" data-a="g1">🌹 1 moeda → Lanceiro</button>
        <button data-t="r" data-a="g5">🫰 5 moedas → Cavaleiro</button>
        <button data-t="r" data-a="g30">🍩 30 moedas → Mago</button>
        <button data-t="r" data-a="g100">🎁 100 moedas → Catapulta</button>
        <button data-t="r" data-a="g500">🔫 500 moedas → Dragão</button>
        <button data-t="r" data-a="g1000">🌌 1000 moedas → 3 Dragões</button>
      </div>
    </div>
    <div class="row">
      <button id="autoBtn" class="on">🤖 Plateia automática: ON</button>
      <button id="resetBtn">🔄 Nova rodada</button>
      <button id="userBtn">📡 Live</button>
      <button id="closeBtn">✖ Fechar</button>
    </div>
    <small>Modo de teste: os botões simulam a plateia da live. Na live de verdade, o servidor manda os comentários, curtidas e presentes direto para o jogo.</small>
  </div>
</div></div>

    win()   { [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => { const d = [0, .14, .28, .42, .62, .82, .96, 1.1][i];
              tone('square', f, 0, i === 7 ? .8 : .16, .07, d); tone('triangle', f / 2, 0, i === 7 ? .8 : .16, .08, d); }); },
  };
  return {
    get on() { return on; },
    toggle() { init(); on = !on; if (on && ac.state === 'suspended') ac.resume(); if (on) SOUNDS.spawn(); return on; },
    play(name) {
      if (!on || !ac) return;
      const t = performance.now() / 1000, lim = LIMIT[name] || 0;
      if (lim && last[name] && t - last[name] < lim) return;
      last[name] = t;
      try { SOUNDS[name](); } catch (e) {}
    },
  };
})();

let units = [], shots = [], parts = [], feed = [], announce = null, shake = 0;
let players = new Map(), likes = { b: 0, r: 0 };
let state = 'play', winner = null, endTimer = 0, roundTime = 0, now = 0;
let uid = 0;

function resetRound() {
  units = []; shots = []; parts = []; announce = null;
  players = new Map(); likes = { b: 0, r: 0 };
  crown.meter = 0; for (const t of towers) { t.meter = 0; t.owner = null; }
  state = 'play'; winner = null; roundTime = 0;
  pushFeed('⚔️ Nova rodada! Comente AZUL ou VERMELHO', '#ffd23f');
}

function pushFeed(text, color) { feed.push({ text, color: color || '#fff', t: 0 }); if (feed.length > 6) feed.shift(); }
function bigAnnounce(text, color) { announce = { text, color, t: 0 }; }

// ===================== TROPAS =====================
function teamCount(team) { let n = 0; for (const u of units) if (u.team === team && u.hp > 0) n++; return n; }

function spawn(team, type, name) {
  if (state !== 'play') return;
  if (teamCount(team) >= CONFIG.maxUnitsPerTeam) {
    if (type === 'soldier') return;
    const old = units.find(u => u.team === team && u.type === 'soldier' && u.hp > 0);
    if (old) { old.hp = 0; old.dead = 0.001; } else return;
  }
  const S = UNIT[type], sp = TEAM[team].spawn;
  const u = {
    id: ++uid, team, type, name: name ? String(name).slice(0, 12) : '', owner: name || '', kills: 0, lvl: 0, dmgMul: 1, glow: 0,
    x: sp.x + rand(-55, 55), y: sp.y + rand(-8, 8), hp: S.hp, max: S.hp,
    cd: rand(0, .5), face: team === 'b' ? 1 : -1, t: rand(0, 10), lunge: 0, hit: 0, born: 0, dead: 0,
    moving: false, target: null, retarget: 0, goal: null, goalObj: null, idle: 0, think: rand(0, 3),
  };
  pickGoal(u);
  units.push(u);
  puff(u.x, u.y - 10, TEAM[team].light, type === 'dragon' ? 30 : 8);
}

function pickGoal(u) {
  let obj = crown;
  if (u.type !== 'catapult' && u.type !== 'dragon') {
    for (const t of towers) if (t.owner !== u.team && Math.random() < 0.28) { obj = t; break; }
  }
  setGoalIn(u, obj);
}
function setGoalIn(u, obj) {
  const a = rand(0, Math.PI * 2), r = Math.sqrt(Math.random()) * obj.r * (obj === crown ? .7 : .5);
  u.goalObj = obj; u.goal = { x: obj.x + Math.cos(a) * r, y: obj.y + Math.sin(a) * r * .85 };
}
function canHit(u, e) { return !(UNIT[e.type].flying && !UNIT[u.type].air); }
function mult(type, etype) { return (COUNTER[type] && COUNTER[type][etype]) || 1; }

function findTarget(u, range) {
  let best = null, bd = range;
  for (const e of units) {
    if (e.team === u.team || e.hp <= 0 || !canHit(u, e)) continue;
    const d = dist(u, e); if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function moveTo(u, x, y, dt) {
  const dx = x - u.x, dy = y - u.y, d = Math.hypot(dx, dy);
  if (d < 1) return;
  const s = Math.min(d, UNIT[u.type].speed * dt);
  u.x += dx / d * s; u.y += dy / d * s; u.moving = true;
  if (Math.abs(dx) > 2) u.face = dx > 0 ? 1 : -1;
}

function updateUnit(u, dt) {
  const S = UNIT[u.type];
  u.t += dt; u.born += dt; u.cd -= dt; u.lunge = Math.max(0, u.lunge - dt); u.hit = Math.max(0, u.hit - dt);
  u.moving = false;
  u.retarget -= dt;
  if (u.retarget <= 0 || (u.target && u.target.hp <= 0)) {
    u.retarget = 0.25 + Math.random() * .1;
    u.target = findTarget(u, u.type === 'catapult' ? S.range : Math.max(S.range + 70, 120));
  }
  const e = u.target;
  if (e && e.hp > 0) {
    const d = dist(u, e);
    if (d > S.range) moveTo(u, e.x, e.y, dt);
    else {
      if (Math.abs(e.x - u.x) > 2) u.face = e.x > u.x ? 1 : -1;
      if (u.cd <= 0) attack(u, e);
    }
    return;
  }
  // sem inimigo: ir para o objetivo
  u.think -= dt;
  if (u.think <= 0) {
    u.think = 3;
    if (u.goalObj !== crown && u.goalObj.owner === u.team) setGoalIn(u, crown);
  }
  if (u.goal) {
    if (Math.hypot(u.goal.x - u.x, u.goal.y - u.y) > 6) moveTo(u, u.goal.x, u.goal.y, dt);
    else {
      u.idle += dt;
      if (u.idle > rand(1.5, 4)) { u.idle = 0; setGoalIn(u, u.goalObj); }
    }
  }
}

function attack(u, e) {
  const S = UNIT[u.type];
  u.cd = S.cd * rand(.9, 1.1); u.lunge = .18;
  const base = S.dmg * u.dmgMul, dmg = base * mult(u.type, e.type);
  if (!S.shot) { damage(e, dmg, u); spark(e.x, e.y - 18); SFX.play('sword'); return; }
  const hy = u.y - S.size * .6 - (S.flying ? 40 : 0);
  if (S.shot === 'arrow') SFX.play('arrow'), shots.push({ k: 'arrow', x: u.x + u.face * 10, y: hy, tg: e, sp: 430, dmg, team: u.team, by: u });
  else if (S.shot === 'orb') SFX.play('zap'), shots.push({ k: 'orb', x: u.x + u.face * 18, y: hy - 10, tg: e, sp: 300, dmg: base, splash: S.splash, team: u.team, src: u.type, by: u });
  else if (S.shot === 'rock') {
    const d = dist(u, e);
    shots.push({ k: 'rock', sx: u.x + u.face * 30, sy: u.y - 40, tx: e.x, ty: e.y, t: 0, dur: clamp(d / 260, .6, 1.3), dmg: base, splash: S.splash, team: u.team, by: u });
  } else if (S.shot === 'fire') {
    SFX.play('fire');
    const mx = u.x + u.face * 50, my = u.y - 40 - 70;
    for (let i = 0; i < 22; i++) {
      const f = Math.random();
      parts.push({ x: mx, y: my, vx: (e.x - mx) * rand(1.6, 2.4) + rand(-30, 30), vy: (e.y - 20 - my) * rand(1.6, 2.4) + rand(-30, 30),
        life: 0, max: rand(.35, .55), size: rand(5, 10), color: f < .4 ? '#ffe36b' : f < .8 ? '#ff8a1f' : TEAM[u.team].color, g: 0 });
    }
    setTimeout(() => areaDamage(e.x, e.y, S.splash, base, u.team, 'dragon', true, u), 220);
  }
}

function damage(e, amt, by) {
  if (e.hp <= 0) return;
  e.hp -= amt; e.hit = .12;
  if (e.hp <= 0) { e.hp = 0; e.dead = .001; SFX.play(UNIT[e.type].flying ? 'boom' : 'death'); if (by) gotKill(by, e); puff(e.x, e.y - 15, '#ddd', UNIT[e.type].flying ? 30 : 10); if (UNIT[e.type].flying) shake = .5; }
}
function areaDamage(x, y, r, amt, team, src, hitsAir, by) {
  for (const e of units) {
    if (e.team === team || e.hp <= 0) continue;
    if (UNIT[e.type].flying && !hitsAir) continue;
    const d = Math.hypot(e.x - x, e.y - y);
    if (d <= r) damage(e, amt * mult(src, e.type) * (1 - d / r * .5), by);
  }
}

// ===================== EVOLUÇÃO =====================
function gotKill(k, victim) {
  if (k.hp <= 0 || k.type === 'dragon') return;
  const L = CONFIG.levels, top = L.length - 1;
  k.kills++;
  // matou um Campeão? sobe direto um nível
  if (victim.lvl === top && k.lvl < top) k.kills = Math.max(k.kills, L[k.lvl + 1].kills);
  const p = players.get(k.owner); if (p) p.pts += 1;
  while (k.lvl < top && k.kills >= L[k.lvl + 1].kills) {
    if (k.lvl + 1 === top) {
      let champs = 0; for (const u of units) if (u.team === k.team && u.hp > 0 && u.lvl === top) champs++;
      if (champs >= CONFIG.maxChampionsPerTeam) break;
    }
    levelUp(k);
  }
}
function levelUp(u) {
  const L = CONFIG.levels; u.lvl++;
  const lv = L[u.lvl], S = UNIT[u.type];
  u.dmgMul = lv.mul; u.max = S.hp * lv.mul; u.hp = u.max; u.glow = 1;
  for (let i = 0; i < 24; i++) {
    const a = i / 24 * Math.PI * 2;
    parts.push({ x: u.x, y: u.y - 20, vx: Math.cos(a) * 90, vy: Math.sin(a) * 60 - 30, life: 0, max: .7, size: 4,
      color: u.lvl === L.length - 1 ? '#ffd23f' : TEAM[u.team].light, g: 0 });
  }
  const who = u.name || UNIT[u.type].label;
  SFX.play(u.lvl === L.length - 1 ? 'champ' : 'level');
  if (u.lvl === L.length - 1) { bigAnnounce('🏆 ' + who + ' virou CAMPEÃO!', '#ffd23f'); shake = Math.max(shake, .3); }
  else pushFeed('⭐ ' + who + ' (' + UNIT[u.type].label + ') virou ' + lv.name + '!', TEAM[u.team].light);
}

// ===================== PARTÍCULAS =====================
function puff(x, y, color, n) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rand(-60, 60), vy: rand(-80, 10), life: 0, max: rand(.4, .8), size: rand(3, 7), color, g: 120 });
}
function spark(x, y) {
  for (let i = 0; i < 4; i++) parts.push({ x, y, vx: rand(-80, 80), vy: rand(-90, -20), life: 0, max: .25, size: 2.5, color: '#fff6c2', g: 200 });
}
function confetti() {
  for (let i = 0; i < 160; i++) parts.push({ x: rand(0, W), y: rand(-60, 0), vx: rand(-40, 40), vy: rand(80, 220), life: 0, max: rand(2.5, 4.5), size: rand(4, 8),
    color: pick(['#ffd23f', TEAM[winner].color, '#ffffff', TEAM[winner].light]), g: 20, sq: true, rot: rand(0, 6) });
}

// ===================== OBJETIVOS =====================
function zoneCount(obj) {
  const c = { b: 0, r: 0 };
  for (const u of units) if (u.hp > 0 && Math.hypot(u.x - obj.x, (u.y - obj.y) / .9) <= obj.r) c[u.team]++;
  return c;
}
function towersOf(team) { return towers.filter(t => t.owner === team).length; }

function updateObjectives(dt) {
  for (const t of towers) {
    const c = zoneCount(t), diff = c.b - c.r;
    if (diff) t.meter = clamp(t.meter + Math.sign(diff) * Math.min(Math.abs(diff), 4) * 9 * dt, -100, 100);
    const prev = t.owner;
    if (t.meter >= 100) t.owner = 'b'; else if (t.meter <= -100) t.owner = 'r';
    else if ((t.owner === 'b' && t.meter <= 0) || (t.owner === 'r' && t.meter >= 0)) t.owner = null;
    if (t.owner && t.owner !== prev) {
      pushFeed('🏰 ' + TEAM[t.owner].name + ' dominou a torre ' + (t.x < 270 ? 'esquerda' : 'direita') + '!', TEAM[t.owner].light);
      puff(t.x, t.y - 60, TEAM[t.owner].light, 20); SFX.play('tower');
    }
    if (t.owner) {
      t.cd -= dt;
      if (t.cd <= 0) {
        let best = null, bd = 165;
        for (const e of units) if (e.team !== t.owner && e.hp > 0) { const d = dist(t, e); if (d < bd) { bd = d; best = e; } }
        if (best) { t.cd = 1.4; SFX.play('arrow'); shots.push({ k: 'arrow', x: t.x, y: t.y - 95, tg: best, sp: 460, dmg: 6, team: t.owner }); }
      }
    }
  }
  const c = zoneCount(crown), diff = c.b - c.r;
  if (diff) {
    const team = diff > 0 ? 'b' : 'r';
    const bonus = 1 + CONFIG.towerBonus * towersOf(team);
    crown.meter = clamp(crown.meter + Math.sign(diff) * Math.min(Math.abs(diff), 5) * CONFIG.crownRate * bonus * dt, -100, 100);
  }
  if (Math.abs(crown.meter) >= 100) win(crown.meter > 0 ? 'b' : 'r');
}

function win(team) {
  state = 'win'; winner = team; endTimer = CONFIG.roundEndSeconds;
  announce = null; confetti(); shake = .6; SFX.play('win');
}

// ===================== PROJÉTEIS =====================
function updateShots(dt) {
  for (const s of shots) {
    if (s.k === 'rock') {
      s.t += dt;
      if (s.t >= s.dur) { s.done = true; SFX.play('boom'); areaDamage(s.tx, s.ty, s.splash, s.dmg, s.team, 'catapult', false, s.by); puff(s.tx, s.ty, '#9b8b6e', 14); shake = Math.max(shake, .15); }
      continue;
    }
    const tg = s.tg; if (!tg || tg.hp <= 0) { s.done = true; continue; }
    const ty = tg.y - UNIT[tg.type].size * .45 - (UNIT[tg.type].flying ? 40 : 0);
    const dx = tg.x - s.x, dy = ty - s.y, d = Math.hypot(dx, dy);
    s.ang = Math.atan2(dy, dx);
    if (d < s.sp * dt + 4) {
      s.done = true;
      if (s.k === 'orb') { areaDamage(tg.x, tg.y, s.splash, s.dmg, s.team, 'mage', true, s.by); puff(tg.x, tg.y - 15, TEAM[s.team].light, 10); }
      else damage(tg, s.dmg, s.by);
    } else { s.x += dx / d * s.sp * dt; s.y += dy / d * s.sp * dt; }
  }
  shots = shots.filter(s => !s.done);
}

// ===================== PLATEIA / EVENTOS =====================
function detectTeam(text) {
  const t = (' ' + String(text || '').toLowerCase() + ' ');
  for (const k of ['b', 'r']) for (const w of CONFIG.teamWords[k]) {
    if (w.length === 1 ? t.trim() === w : t.includes(w)) return k;
  }
  return null;
}
function playerOf(user, text, key) {
  key = key || user;
  let p = players.get(key);
  if (!p) {
    let team = detectTeam(text);
    if (!team) {
      let nb = 0, nr = 0; for (const q of players.values()) q.team === 'b' ? nb++ : nr++;
      team = nb === nr ? pick(['b', 'r']) : (nb < nr ? 'b' : 'r');
    }
    p = { name: String(user).slice(0, 14), team, pts: 0, lastC: -99 };
    players.set(key, p);
    pushFeed('➕ ' + user + ' entrou no ' + TEAM[team].name, TEAM[team].light);
  }
  return p;
}
function giftTier(coins) { for (const g of CONFIG.gifts) if (coins >= g.min) return g; return null; }

// Formato do evento: {type:'comment'|'like'|'gift', user, text, count, coins}
function handleEvent(ev) {
  if (state !== 'play' || !ev || !ev.user) return;
  // comentário só serve para escolher o time (AZUL ou VERMELHO)
  if (ev.type === 'comment') {
    if (!players.has(ev.id || ev.user) && detectTeam(ev.text)) playerOf(ev.user, ev.text, ev.id);
    return;
  }
  const p = playerOf(ev.user, ev.text, ev.id);   // quem curtir/presentear sem escolher vai para o time menor
  if (ev.type === 'like') {
    likes[p.team] += ev.count || 1;
    while (likes[p.team] >= CONFIG.likesPerSoldier) { likes[p.team] -= CONFIG.likesPerSoldier; p.pts += 1; spawn(p.team, 'soldier', p.name); }

const SERVER_MODE = /^https?:$/.test(location.protocol) && !/claude|anthropic|localhost:8765/.test(location.host);
let live = { status: SERVER_MODE ? 'connecting' : 'test', user: '', detail: '' };
const store = { get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let ws = null, wsRetry = null;
function liveUser() { return new URLSearchParams(location.search).get('user') || store.get('tt_user'); }
function connectLive() {
  clearTimeout(wsRetry);
  try { ws && ws.close(); } catch (e) {}
  const u = liveUser();
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws' + (u ? '?user=' + encodeURIComponent(u) : ''));
  ws.onmessage = m => {
    let ev; try { ev = JSON.parse(m.data); } catch (e) { return; }
    if (ev.type === 'status') {
      const was = live.status;
      live = { status: ev.status, user: ev.user || u, detail: ev.detail || '' };
      if (ev.status === 'nouser') { showSetup(); return; }
      if (ev.status === 'live' && was !== 'live') { setAuto(false); pushFeed('📡 Conectado à live de @' + live.user + '!', '#7dff9a'); SFX.play('tower'); }
      return;
    }
    handleEvent(ev);
  };
  ws.onopen = () => { clearInterval(ws.keep); const me = ws; ws.keep = setInterval(() => { try { me.send('p'); } catch (e) {} }, 45000); };
  ws.onclose = () => { clearInterval(ws && ws.keep); if (live.status !== 'nouser') { live.status = 'server'; wsRetry = setTimeout(connectLive, 3000); } };
}

// ===================== LOOP =====================
function update(dt) {
  now += dt; roundTime += dt;
  if (auto && state === 'play') autoAudience(dt);
  if (state === 'play') {
    for (const u of units) if (u.hp > 0) updateUnit(u, dt);
    // separação (ninguém fica empilhado)
    for (let i = 0; i < units.length; i++) {
      const a = units[i]; if (a.hp <= 0) continue;
      const fa = !!UNIT[a.type].flying;
      for (let j = i + 1; j < units.length; j++) {
        const b = units[j]; if (b.hp <= 0 || fa !== !!UNIT[b.type].flying) continue;
        const dx = b.x - a.x, dy = b.y - a.y, min = UNIT[a.type].rad + UNIT[b.type].rad;
        if (Math.abs(dx) > min || Math.abs(dy) > min) continue;
        const d = Math.hypot(dx, dy) || .01;
        if (d < min) { const push = (min - d) / 2, nx = dx / d, ny = dy / d; a.x -= nx * push; a.y -= ny * push; b.x += nx * push; b.y += ny * push; }
      }
    }
    for (const u of units) { u.x = clamp(u.x, 14, W - 14); u.y = clamp(u.y, 150, H - 20); }
    updateShots(dt);
    updateObjectives(dt);
  } else {
    endTimer -= dt;
    if (endTimer <= 0) resetRound();
  }
  for (const u of units) { if (u.dead > 0) u.dead += dt; if (u.glow > 0) u.glow = Math.max(0, u.glow - dt * 1.5); }
  units = units.filter(u => u.hp > 0 || u.dead < .5);
  for (const p of parts) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; if (p.rot !== undefined) p.rot += dt * 5; }
  parts = parts.filter(p => p.life < p.max);
  for (const f of feed) f.t += dt;
  feed = feed.filter(f => f.t < 5);
  if (announce) { announce.t += dt; if (announce.t > 2.6) announce = null; }
  shake = Math.max(0, shake - dt);
}

function txt(s, x, y, size, fill, align, stroke) {

  ctx.lineJoin = 'round'; ctx.lineWidth = stroke === undefined ? Math.max(3, size / 5) : stroke; ctx.strokeStyle = '#111';
  if (ctx.lineWidth) ctx.strokeText(s, x, y);

}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

function drawSprite(key, x, y, h, flip, alpha, rot) {
  const im = IMG[key]; if (!im || !im.width) return 0;
  const w = h * im.width / im.height;
  ctx.save(); ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1); if (rot) ctx.rotate(rot);
  ctx.drawImage(im, -w / 2, -h, w, h); ctx.restore();
  return w;
}

function drawUnit(u) {
  const S = UNIT[u.type], fly = !!S.flying;
  let alpha = Math.min(1, u.born / .3);
  if (u.dead > 0) alpha *= 1 - u.dead / .5;
  const bob = u.moving ? -Math.abs(Math.sin(u.t * 10)) * (fly ? 0 : 3) : 0;
  const tilt = u.moving && !fly && u.type !== 'catapult' ? Math.sin(u.t * 10) * .05 : 0;
  const lx = u.lunge > 0 ? u.face * Math.sin(u.lunge / .18 * Math.PI) * 6 : 0;
  const lift = fly ? 40 + Math.sin(u.t * 3) * 6 : 0;
  const lv = CONFIG.levels[u.lvl], size = S.size * lv.scale;
  const im = IMG[u.type + '_' + u.team]; const w = im && im.width ? size * im.width / im.height : size * .7;
  if (u.lvl >= 2 && u.dead === 0) {
    const champ = u.lvl === CONFIG.levels.length - 1, cy = u.y - lift - size * .45, R = size * (champ ? .75 : .62);
    const ag = ctx.createRadialGradient(u.x, cy, 2, u.x, cy, R);
    const col = champ ? '255,210,63' : (u.team === 'b' ? '61,123,255' : '255,64,64');
    ag.addColorStop(0, 'rgba(' + col + ',' + (.45 + Math.sin(u.t * 4) * .12) + ')'); ag.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(u.x, cy, R, 0, 7); ctx.fill();
    if (champ && Math.random() < .2) parts.push({ x: u.x + rand(-w / 3, w / 3), y: u.y - rand(0, size), vx: 0, vy: -30, life: 0, max: .6, size: 2.5, color: '#fff2a8', g: 0 });
  }
  if (u.glow > 0) {
    ctx.globalAlpha = u.glow; ctx.strokeStyle = '#fff6c2'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(u.x, u.y - 4, (1 - u.glow) * 50 + 10, ((1 - u.glow) * 50 + 10) * .4, 0, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.globalAlpha = alpha * (fly ? .18 : .28); ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(u.x, u.y, w * .38, fly ? 8 : 5, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  const rot = tilt + (u.dead > 0 ? u.face * u.dead * 2.5 : 0);
  drawSprite(u.type + '_' + u.team, u.x + lx, u.y + bob - lift, size, u.face < 0, alpha, rot);

  }
  if (u.dead > 0) return;
  const top = u.y - lift - size - 4;

    ctx.fillStyle = '#111'; ctx.fillRect(u.x - bw / 2 - 1, top - 1, bw + 2, 6);
    ctx.fillStyle = u.hp / u.max > .5 ? '#5be36b' : u.hp / u.max > .25 ? '#ffd23f' : '#ff4d4d';
    ctx.fillRect(u.x - bw / 2, top, bw * u.hp / u.max, 4);
  }
  const champ = u.lvl === CONFIG.levels.length - 1;
  let ny = top - 8;

}

  ctx.restore();
  const top = [...players.values()].filter(q => q.team === winner && q.pts > 0).sort((a, b) => b.pts - a.pts).slice(0, 3);
  if (top.length) {
    txt('HERÓIS DA BATALHA', W / 2, 500, 22, '#fff');
    top.forEach((q, i) => txt(['🥇', '🥈', '🥉'][i] + ' ' + q.name + '  ·  ' + q.pts + ' pts', W / 2, 540 + i * 34, 22, T.light));
  }
  txt('Nova rodada em ' + Math.ceil(endTimer) + '...', W / 2, 680, 20, '#ddd');
}

function drawLiveStatus() {
  if (live.status === 'test') return;
  const M = { live: ['🔴 AO VIVO @' + live.user, '#2e9d4f'], connecting: ['⏳ Conectando à live...', '#8a6d1f'],
    offline: ['⏳ Esperando a live de @' + live.user, '#8a6d1f'], reconnecting: ['🔄 Reconectando...', '#8a6d1f'],
    error: ['⚠️ ' + (live.detail || 'Erro na conexão').slice(0, 40), '#9c1717'], server: ['🔄 Servidor reconectando...', '#8a6d1f'],
    nouser: ['📡 Toque em Teste › Live', '#3a4250'] };
  const [t, c] = M[live.status] || [live.status, '#3a4250'];
  ctx.font = "13px 'Lilita One', system-ui"; const w = ctx.measureText(t).width + 20;
  ctx.globalAlpha = live.status === 'live' ? .75 : .92;
  ctx.fillStyle = c; rrect(W / 2 - w / 2, H - 34, w, 24, 12); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.stroke();
  txt(t, W / 2, H - 21.5, 13, '#fff', 'center', 0); ctx.globalAlpha = 1;
}

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (shake > 0) ctx.translate(rand(-1, 1) * shake * 10, rand(-1, 1) * shake * 10);
  ctx.drawImage(bg, 0, 0, W, H);
  drawCrownZone();
  // tudo que tem profundidade, ordenado por y
  const list = [];
  for (const k of ['r', 'b']) list.push({ y: TEAM[k].castleBottom, f: () => drawSprite('castle_' + k, 270, TEAM[k].castleBottom, 128) });
  for (const t of towers) list.push({ y: t.y + 30, f: () => drawSprite('tower_' + (t.owner || 'n'), t.x, t.y + 34, 138) });
  list.push({ y: crown.y + 20, f: drawCrown });
  for (const u of units) list.push({ y: u.y + (UNIT[u.type].flying ? 1000 : 0), f: () => drawUnit(u) });
  list.sort((a, b) => a.y - b.y);
  for (const o of list) o.f();
  for (const s of shots) drawShot(s);
  for (const p of parts) {
    ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.color;
    if (p.sq) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 - p.life / p.max * .5), 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  drawHUD(); drawFeed(); if (state !== 'win') drawAnnounce();
  drawLiveStatus();
  if (state === 'win') drawWin();
}

let last = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  update(dt); draw();
  requestAnimationFrame(frame);
}

drawBackground();
Promise.all([loadImages(), document.fonts ? document.fonts.load("20px 'Lilita One'").catch(() => {}) : 0]).then(() => {
  resetRound();
  requestAnimationFrame(frame);
});
</script>
